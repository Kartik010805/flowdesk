<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Employee Requests - FlowDesk</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Employee Requests</h2>
        <a href="/manager/dashboard" class="btn btn-outline-secondary">
            Dashboard
        </a>
    </div>

    <div th:if="${successMessage}" class="alert alert-success"
         th:text="${successMessage}"></div>

    <div th:if="${errorMessage}" class="alert alert-danger"
         th:text="${errorMessage}"></div>

    <div class="card shadow-sm">
        <div class="card-body">

            <div th:if="${#lists.isEmpty(requests)}"
                 class="text-center text-muted py-4">
                No employee requests found.
            </div>

            <div class="table-responsive"
                 th:unless="${#lists.isEmpty(requests)}">

                <table class="table table-hover align-middle">
                    <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Employee</th>
                        <th>Title</th>
                        <th>Type</th>
                        <th>Date</th>
                        <th>Status</th>
                        <th style="min-width: 280px;">Decision</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="request : ${requests}">
                        <td th:text="${request.id}"></td>
                        <td th:text="${request.employee.fullName}"></td>
                        <td th:text="${request.title}"></td>
                        <td th:text="${request.type}"></td>
                        <td th:text="${#temporals.format(request.createdAt, 'dd-MM-yyyy')}"></td>
                        <td>
                            <span class="badge bg-warning text-dark"
                                  th:if="${request.status.name() == 'SUBMITTED'}"
                                  th:text="${request.status}"></span>

                            <span class="badge bg-info"
                                  th:if="${request.status.name() == 'IN_REVIEW'}"
                                  th:text="${request.status}"></span>

                            <span class="badge bg-success"
                                  th:if="${request.status.name() == 'APPROVED'}"
                                  th:text="${request.status}"></span>

                            <span class="badge bg-danger"
                                  th:if="${request.status.name() == 'REJECTED'}"
                                  th:text="${request.status}"></span>
                        </td>

                        <td>
                            <form th:if="${request.status.name() == 'SUBMITTED' or request.status.name() == 'IN_REVIEW'}"
                                  th:action="@{/manager/requests/{id}/decision(id=${request.id})}"
                                  method="post">

                                <input type="text"
                                       name="comments"
                                       class="form-control form-control-sm mb-2"
                                       placeholder="Optional comments">

                                <button type="submit"
                                        name="approved"
                                        value="true"
                                        class="btn btn-success btn-sm">
                                    Approve
                                </button>

                                <button type="submit"
                                        name="approved"
                                        value="false"
                                        class="btn btn-danger btn-sm">
                                    Reject
                                </button>
                            </form>

                            <span th:if="${request.status.name() != 'SUBMITTED' and request.status.name() != 'IN_REVIEW'}"
                                  class="text-muted">
                                Decision completed
                            </span>
                        </td>
                    </tr>
                    </tbody>
                </table>

            </div>
        </div>
    </div>

    <form th:action="@{/logout}" method="post" class="mt-3">
        <button type="submit" class="btn btn-outline-danger">
            Logout
        </button>
    </form>

</div>

</body>
</html>
