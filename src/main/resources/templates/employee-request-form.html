
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Submit Request | FlowDesk</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #f4f6fa;
        }

        .request-card {
            max-width: 700px;
            margin: 50px auto;
            border: none;
            border-radius: 14px;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-dark bg-primary px-4">
    <a class="navbar-brand fw-bold" href="/employee/dashboard">
        FlowDesk
    </a>

    <form th:action="@{/logout}" method="post">
        <button class="btn btn-light btn-sm" type="submit">
            Logout
        </button>
    </form>
</nav>

<div class="container">

    <div class="card request-card shadow-sm p-4">

        <h3 class="fw-bold mb-2">Submit a Request</h3>

        <p class="text-muted mb-4">
            Provide the details below to submit a request for approval.
        </p>

        <div th:if="${successMessage}"
             class="alert alert-success"
             th:text="${successMessage}">
        </div>

        <form th:action="@{/employee/requests/create}" method="post">

            <div class="mb-3">
                <label class="form-label fw-semibold">Request Title</label>
                <input type="text"
                       name="title"
                       class="form-control"
                       maxlength="200"
                       placeholder="Enter request title"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Request Type</label>

                <select name="type" class="form-select" required>
                    <option value="">Select request type</option>

                    <option th:each="type : ${requestTypes}"
                            th:value="${type}"
                            th:text="${type}">
                    </option>
                </select>
            </div>

            <div class="mb-4">
                <label class="form-label fw-semibold">Description</label>

                <textarea name="description"
                          class="form-control"
                          rows="5"
                          placeholder="Explain your request in detail..."
                          required></textarea>
            </div>

            <div class="d-flex justify-content-between">
                <a href="/employee/dashboard"
                   class="btn btn-outline-secondary">
                    Cancel
                </a>

                <button type="submit" class="btn btn-primary px-4">
                    Submit Request
                </button>
            </div>

        </form>

    </div>

</div>

</body>
</html>
