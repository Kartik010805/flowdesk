
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Requests | FlowDesk</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #f4f6fa;
        }

        .page-title {
            font-weight: 700;
            color: #252b3b;
        }

        .request-card {
            border: none;
            border-radius: 12px;
        }

        .status {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .SUBMITTED {
            background: #fff3cd;
            color: #856404;
        }

        .IN_REVIEW {
            background: #cfe2ff;
            color: #084298;
        }

        .APPROVED {
            background: #d1e7dd;
            color: #0f5132;
        }

        .REJECTED {
            background: #f8d7da;
            color: #842029;
        }

        .DRAFT, .CANCELLED {
            background: #e2e3e5;
            color: #41464b;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-dark bg-primary px-4">
    <a class="navbar-brand fw-bold" href="/employee/dashboard">
        FlowDesk Employee
    </a>

    <form th:action="@{/logout}" method="post">
        <button class="btn btn-light btn-sm" type="submit">
            Logout
        </button>
    </form>
</nav>

<div class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="page-title">My Requests</h2>
            <p class="text-muted">
                Track all your submitted requests and their status.
            </p>
        </div>

        <a href="/employee/requests/new" class="btn btn-primary">
            + New Request
        </a>
    </div>

    <div class="card request-card shadow-sm">
        <div class="card-body p-4">

            <div th:if="${#lists.isEmpty(requests)}"
                 class="text-center py-5">

                <h5>No requests found</h5>

                <p class="text-muted">
                    You haven't submitted any requests yet.
                </p>

                <a href="/employee/requests/new"
                   class="btn btn-primary">
                    Submit Your First Request
                </a>
            </div>

            <div th:unless="${#lists.isEmpty(requests)}"
                 class="table-responsive">

                <table class="table table-hover align-middle">

                    <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>Title</th>
                        <th>Type</th>
                        <th>Submitted On</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                    </thead>

                    <tbody>

                    <tr th:each="request : ${requests}">

                        <td th:text="${request.id}"></td>

                        <td>
                            <strong th:text="${request.title}"></strong>
                        </td>

                        <td th:text="${request.type}"></td>

                        <td th:text="${request.createdAt != null ? #temporals.format(request.createdAt, 'dd MMM yyyy, hh:mm a') : 'Not available'}"></td>

                        <td>
                            <span class="status"
                                  th:classappend="${request.status}"
                                  th:text="${request.status}">
                            </span>
                        </td>

                        <td>
                            <a th:href="@{/employee/requests/{id}(id=${request.id})}"
                               class="btn btn-sm btn-outline-primary">
                                View Details
                            </a>
                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>
    </div>

    <div class="mt-4">
        <a href="/employee/dashboard"
           class="text-decoration-none">
            ← Back to Dashboard
        </a>
    </div>

</div>

</body>
</html>
