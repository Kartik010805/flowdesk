
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>All Requests - FlowDesk</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>All Employee Requests</h2>
        <a href="/admin/dashboard" class="btn btn-outline-secondary">
            Dashboard
        </a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">

            <div th:if="${#lists.isEmpty(requests)}"
                 class="text-center text-muted py-4">
                No requests have been submitted yet.
            </div>

            <div class="table-responsive"
                 th:unless="${#lists.isEmpty(requests)}">

                <table class="table table-hover align-middle">

                    <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Employee</th>
                        <th>Title</th>
                        <th>Type</th>
                        <th>Department</th>
                        <th>Submitted</th>
                        <th>Status</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="request : ${requests}">

                        <td th:text="${request.id}"></td>

                        <td th:text="${request.employee.fullName}"></td>

                        <td th:text="${request.title}"></td>

                        <td th:text="${request.type}"></td>

                        <td th:text="${request.department != null
                            ? request.department.name : 'N/A'}"></td>

                        <td th:text="${#temporals.format(
                            request.createdAt, 'dd-MM-yyyy')}"></td>

                        <td>
                            <span class="badge bg-success"
                                  th:if="${request.status.name() == 'APPROVED'}"
                                  th:text="${request.status}"></span>

                            <span class="badge bg-danger"
                                  th:if="${request.status.name() == 'REJECTED'}"
                                  th:text="${request.status}"></span>

                            <span class="badge bg-warning text-dark"
                                  th:if="${request.status.name() == 'SUBMITTED'
                                      or request.status.name() == 'IN_REVIEW'}"
                                  th:text="${request.status}"></span>

                            <span class="badge bg-secondary"
                                  th:if="${request.status.name() == 'DRAFT'
                                      or request.status.name() == 'CANCELLED'}"
                                  th:text="${request.status}"></span>
                        </td>

                    </tr>
                    </tbody>

                </table>
            </div>

        </div>
    </div>

    <form th:action="@{/logout}" method="post" class="mt-3">
        <button type="submit" class="btn btn-outline-danger">
            Logout
        </button>
    </form>

</div>

</body>
</html>
