
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Audit Logs | FlowDesk</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #f5f7fb;
        }

        .page-header {
            background: white;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .content-card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
        }

        .table th {
            color: #64748b;
            font-size: 13px;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .table td {
            vertical-align: middle;
        }

        .action-badge {
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .submitted {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .approved {
            background: #dcfce7;
            color: #15803d;
        }

        .rejected {
            background: #fee2e2;
            color: #b91c1c;
        }
    </style>
</head>

<body>

<div class="container py-5">

    <div class="page-header d-flex justify-content-between align-items-center flex-wrap gap-3">
        <div>
            <h3 class="mb-1">Audit Logs</h3>
            <p class="text-muted mb-0">
                Track request submissions, approvals and rejections.
            </p>
        </div>

        <a href="/dashboard" class="btn btn-outline-secondary">
            Back to Dashboard
        </a>
    </div>

    <div class="content-card">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h5 class="mb-0">Activity History</h5>

            <span class="badge bg-secondary"
                  th:text="${#lists.size(auditLogs)} + ' records'">
                0 records
            </span>
        </div>

        <div class="table-responsive">

            <table class="table table-hover align-middle">

                <thead>
                <tr>
                    <th>ID</th>
                    <th>Actor</th>
                    <th>Action</th>
                    <th>Details</th>
                    <th>Date & Time</th>
                </tr>
                </thead>

                <tbody>

                <tr th:each="log : ${auditLogs}">
                    <td th:text="${log.id}">1</td>

                    <td>
                        <span class="fw-semibold"
                              th:text="${log.actorEmail}">
                            user@example.com
                        </span>
                    </td>

                    <td>
                        <span class="action-badge"
                              th:classappend="${log.action == 'REQUEST_SUBMITTED' ? ' submitted' :
                                               (log.action == 'REQUEST_APPROVED' ? ' approved' : ' rejected')}"
                              th:text="${log.action}">
                            REQUEST_SUBMITTED
                        </span>
                    </td>

                    <td th:text="${log.details}">
                        Request details
                    </td>

                    <td class="text-muted"
                        th:text="${#temporals.format(log.createdAt, 'dd MMM yyyy, hh:mm a')}">
                        22 Nov 2026
                    </td>
                </tr>

                <tr th:if="${#lists.isEmpty(auditLogs)}">
                    <td colspan="5" class="text-center text-muted py-5">
                        No audit records found yet.
                    </td>
                </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

</body>
</html>
