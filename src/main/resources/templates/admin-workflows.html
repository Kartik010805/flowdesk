
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Approval Workflows | FlowDesk</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark px-4">
    <a class="navbar-brand fw-bold" href="/admin/dashboard">FlowDesk</a>
    <div class="d-flex align-items-center gap-3">
        <a href="/admin/dashboard" class="text-white text-decoration-none">Dashboard</a>
        <form th:action="@{/logout}" method="post" class="m-0">
            <button class="btn btn-outline-light btn-sm" type="submit">Logout</button>
        </form>
    </div>
</nav>

<div class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold">Approval Workflows</h2>
            <p class="text-muted mb-0">
                View the approval steps configured for each request type.
            </p>
        </div>
        <a href="/admin/dashboard" class="btn btn-outline-secondary">
            Back to Dashboard
        </a>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body">

            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Request Type</th>
                        <th>Step Name</th>
                        <th>Step Order</th>
                        <th>Approver Role</th>
                        <th>Status</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="step : ${approvalSteps}">
                        <td th:text="${step.id}"></td>
                        <td th:text="${step.requestType}"></td>
                        <td th:text="${step.stepName}"></td>
                        <td th:text="${step.stepOrder}"></td>
                        <td th:text="${step.approverRole}"></td>
                        <td>
                            <span th:if="${step.active}"
                                  class="badge bg-success">Active</span>
                            <span th:unless="${step.active}"
                                  class="badge bg-secondary">Inactive</span>
                        </td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(approvalSteps)}">
                        <td colspan="6" class="text-center text-muted py-4">
                            No approval workflows configured.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>

</div>

</body>
</html>
